<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Fredoka:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root {
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  --bg:#f4f7ff;
  --card:#fff;
  --tx:#14213d;
  --mu:#64708a;
  --bd:#e3e9f6;
  --pr:#2f6bff;
  --pr2:#e8efff;
  --ok:#16a34a;
  --okbg:#dcfce7;
  --bad:#dc2626;
  --badbg:#fee2e2
}

@media(prefers-color-scheme:dark) {
  :root:not([data-theme=light]) {
    --bg:#0d1526;
    --card:#16213a;
    --tx:#e8eeff;
    --mu:#94a3c4;
    --bd:#25324f;
    --pr:#5b8cff;
    --pr2:#1e2f57;
    --okbg:#12361f;
    --badbg:#411a1a
  }
}

:root[data-theme=dark] {
  --bg:#0d1526;
  --card:#16213a;
  --tx:#e8eeff;
  --mu:#94a3c4;
  --bd:#25324f;
  --pr:#5b8cff;
  --pr2:#1e2f57;
  --okbg:#12361f;
  --badbg:#411a1a
}

html {
  scroll-padding-top:env(safe-area-inset-top,0px)
}

*,*:before,*:after {
  box-sizing:inherit
}

body {
  margin:0;
  background:var(--bg);
  color:var(--tx);
  font:14px/1.5 Inter,system-ui,sans-serif
}

button {
  font:inherit;
  cursor:pointer;
  border:0;
  color:inherit
}

button:focus-visible,input:focus-visible,select:focus-visible {
  outline:2px solid var(--pr);
  outline-offset:2px
}

header {
  position:sticky;
  top:env(safe-area-inset-top,0px);
  z-index:5;
  background:var(--card);
  border-bottom:1px solid var(--bd);
  display:flex;
  align-items:center;
  gap:20px;
  padding:10px 24px;
  flex-wrap:wrap
}

.logo {
  font-weight:800;
  font-size:18px;
  color:var(--pr);
  display:flex;
  align-items:center;
  gap:8px;
  background:none
}

.logo i {
  width:28px;
  height:28px;
  border-radius:8px;
  background:var(--pr);
  color:#fff;
  display:grid;
  place-items:center;
  font-style:normal;
  font-size:15px
}

nav {
  display:flex;
  gap:4px;
  flex:1;
  overflow-x:auto
}

nav button {
  background:none;
  padding:8px 12px;
  border-radius:8px;
  color:var(--mu);
  font-weight:500;
  white-space:nowrap
}

nav button.on {
  color:var(--pr);
  background:var(--pr2);
  font-weight:600
}

.hs {
  display:flex;
  gap:8px;
  align-items:center
}

.hs input {
  border:1px solid var(--bd);
  background:var(--bg);
  color:var(--tx);
  border-radius:8px;
  padding:8px 12px;
  width:200px;
  max-width:100%
}

.hs .logout {
  background:var(--badbg);
  color:var(--bad)
}

.auth-back {
  display:flex;
  justify-content:space-between;
  gap:8px;
  align-items:center;
  margin-bottom:12px
}

.tb {
  display:flex;
  gap:6px;
  overflow-x:auto;
  padding:6px;
  background:var(--card);
  border:1px solid var(--bd);
  border-radius:12px;
  margin:0 0 18px
}

.tb button {
  flex:1;
  min-width:130px;
  padding:9px 12px;
  border-radius:8px;
  background:none;
  color:var(--mu);
  font-weight:600;
  white-space:nowrap
}

.tb button.on {
  background:var(--pr);
  color:#fff
}

.lesson {
  line-height:1.75
}

.lesson ul {
  margin:8px 0 14px 20px;
  padding:0
}

.keypoints {
  background:var(--pr2);
  border-radius:12px;
  padding:14px 16px;
  margin-top:14px
}

.av {
  width:32px;
  height:32px;
  border-radius:50%;
  background:var(--pr2);
  display:grid;
  place-items:center
}

main {
  max-width:1080px;
  margin:0 auto;
  padding:24px 20px 56px
}

h1 {
  font-size:28px;
  line-height:1.2;
  margin:0 0 8px;
  font-weight:800
}

h2 {
  font-size:18px;
  margin:28px 0 12px
}

h3 {
  margin:0 0 4px;
  font-size:15px
}

p {
  margin:0 0 10px
}

.mu {
  color:var(--mu)
}

.sm {
  font-size:12px
}

.card {
  background:var(--card);
  border:1px solid var(--bd);
  border-radius:14px;
  padding:16px
}

.btn {
  background:var(--pr);
  color:#fff;
  padding:9px 16px;
  border-radius:9px;
  font-weight:600
}

.btn.s {
  background:var(--pr2);
  color:var(--pr)
}

.btn.w {
  width:100%
}

.btn:disabled {
  opacity:.45;
  cursor:not-allowed
}

.hero {
  display:grid;
  grid-template-columns:1.2fr 1fr;
  gap:20px;
  align-items:center;
  background:linear-gradient(120deg,var(--pr2),var(--card));
  border:1px solid var(--bd);
  border-radius:18px;
  padding:32px
}

.hero .big {
  font-size:110px;
  text-align:center
}

.bar {
  display:flex;
  gap:8px;
  margin-top:16px
}

.bar input {
  flex:1;
  border:1px solid var(--bd);
  background:var(--card);
  color:var(--tx);
  border-radius:9px;
  padding:10px 14px;
  min-width:0
}

.grid {
  display:grid;
  gap:14px
}

.g6 {
  grid-template-columns:repeat(auto-fill,minmax(150px,1fr))
}

.g3 {
  grid-template-columns:repeat(auto-fill,minmax(250px,1fr))
}

.g2 {
  grid-template-columns:repeat(auto-fill,minmax(300px,1fr))
}

.subj {
  text-align:center;
  cursor:pointer;
  background:var(--card)
}

.subj:hover {
  border-color:var(--pr)
}

.ic {
  width:40px;
  height:40px;
  border-radius:10px;
  display:inline-grid;
  place-items:center;
  font-size:20px;
  flex:none
}

.item {
  display:flex;
  gap:12px;
  align-items:flex-start
}

.item>div:last-child {
  flex:1;
  min-width:0
}

.tag {
  display:inline-block;
  background:var(--pr2);
  color:var(--pr);
  border-radius:6px;
  padding:1px 8px;
  font-size:11px;
  font-weight:600
}

.layout {
  display:grid;
  grid-template-columns:200px 1fr;
  gap:18px
}

.side {
  display:flex;
  flex-direction:column;
  gap:4px
}

.side button {
  background:none;
  text-align:left;
  padding:9px 12px;
  border-radius:9px;
  color:var(--mu);
  font-weight:500
}

.side button.on {
  background:var(--pr2);
  color:var(--pr);
  font-weight:600
}

.row {
  display:flex;
  gap:10px;
  flex-wrap:wrap;
  margin-bottom:14px
}

.row select,.row input {
  border:1px solid var(--bd);
  background:var(--card);
  color:var(--tx);
  border-radius:9px;
  padding:9px 12px
}

.row input {
  flex:1;
  min-width:160px
}

.prog {
  height:8px;
  background:var(--pr2);
  border-radius:9px;
  overflow:hidden
}

.prog i {
  display:block;
  height:100%;
  background:var(--pr);
  border-radius:9px
}

.opt {
  display:flex;
  gap:10px;
  align-items:center;
  width:100%;
  text-align:left;
  background:var(--card);
  border:1.5px solid var(--bd);
  border-radius:10px;
  padding:11px 14px;
  margin-bottom:8px
}

.opt:hover {
  border-color:var(--pr)
}

.opt.sel {
  border-color:var(--pr);
  background:var(--pr2)
}

.opt.ok {
  border-color:var(--ok);
  background:var(--okbg)
}

.opt.no {
  border-color:var(--bad);
  background:var(--badbg)
}

.num {
  display:grid;
  grid-template-columns:repeat(5,1fr);
  gap:8px
}

.num button {
  aspect-ratio:1;
  border-radius:50%;
  background:var(--pr2);
  color:var(--pr);
  font-weight:600
}

.num button.cur {
  background:var(--pr);
  color:#fff
}

.num button.done {
  background:var(--okbg);
  color:var(--ok)
}

.stats {
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(150px,1fr));
  gap:14px;
  margin-bottom:18px
}

.stat b {
  font-size:28px;
  display:block
}

.flow {
  display:flex;
  gap:8px;
  flex-wrap:wrap;
  align-items:center;
  justify-content:center
}

.flow span {
  text-align:center;
  flex:1;
  min-width:110px
}

.flow em {
  font-style:normal;
  color:var(--mu)
}

.score {
  font-size:56px;
  font-weight:800;
  color:var(--pr);
  text-align:center;
  line-height:1
}

.crumb {
  background:none;
  color:var(--pr);
  padding:0;
  margin-bottom:12px;
  font-weight:600
}

.eq {
  background:var(--pr2);
  border-radius:10px;
  padding:12px 16px;
  font-family:Georgia,serif;
  font-size:18px;
  text-align:center;
  margin:10px 0
}

@media(max-width:760px) {
  .hero {
    grid-template-columns:1fr;
    padding:20px
  }
  .hero .big {
    font-size:70px
  }
  .layout {
    grid-template-columns:1fr
  }
  .side {
    flex-direction:row;
    overflow-x:auto
  }
  .side button {
    white-space:nowrap
  }
  header {
    padding:10px 14px
  }
  .hs input {
    width:120px
  }
  h1 {
    font-size:23px
  }
}

@media(prefers-reduced-motion:no-preference) {
  .prog i {
    transition:width .4s
  }
}

.av {
  border:0;
  font-weight:700;
  color:var(--pr);
  cursor:pointer
}

.av.big {
  width:72px;
  height:72px;
  font-size:28px;
  margin:0 auto
}

.fld {
  margin-bottom:12px
}

.fld label {
  display:block;
  font-weight:600;
  font-size:13px;
  margin-bottom:4px
}

.fld input,.fld select {
  width:100%;
  border:1px solid var(--bd);
  background:var(--bg);
  color:var(--tx);
  border-radius:9px;
  padding:10px 12px;
  font:inherit
}

.auth {
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:18px;
  max-width:860px;
  margin:24px auto
}

.pan {
  background:linear-gradient(140deg,var(--pr),#5b8cff);
  color:#fff;
  border-radius:18px;
  padding:32px;
  display:flex;
  flex-direction:column;
  justify-content:center
}

.pan p {
  opacity:.92
}

.err {
  background:var(--badbg);
  color:var(--bad);
  border-radius:9px;
  padding:8px 12px
}

.okm {
  color:var(--ok);
  font-weight:600
}

.cta {
  text-align:center;
  margin-top:28px;
  background:var(--pr2)
}

.foot {
  text-align:center;
  color:var(--mu);
  font-size:12px;
  margin-top:28px
}

.layout.lp {
  grid-template-columns:260px 1fr
}

@media(max-width:760px) {
  .layout.lp {
    grid-template-columns:1fr
  }
  .auth {
    grid-template-columns:1fr
  }
  .pan {
    display:none
  }
}

.hero .big svg {
  display:block;
  margin:0 auto;
  width:100%;
  max-width:340px;
  height:auto
}

@media(prefers-reduced-motion:no-preference) {
    .fl {
    animation:flt 4s ease-in-out infinite
  }
  .fl.b {
    animation-delay:-1.3s
  }
  .fl.c {
    animation-delay:-2.6s
  }
    .wv {
    transform-origin:202px 160px;
    animation:wv 2.4s ease-in-out infinite
  }
    .tw {
    animation:flt 3s ease-in-out infinite
  }
    @keyframes flt {
    50% {
      transform:translateY(-7px)
    }
  }
    @keyframes wv {
    50% {
      transform:rotate(-14deg)
    }
  }
}

@media(max-width:760px) {
  .hero .big svg {
    max-width:190px
  }
}

/* Paket & modal */
.pro-b {
  background:linear-gradient(135deg,#7c6bff,#3aa0ff);
  color:#fff
}

.md {
  position:fixed;
  inset:0;
  z-index:20;
  background:rgba(10,20,45,.55);
  display:flex;
  align-items:center;
  justify-content:center;
  padding:16px;
  overflow:auto
}

.dlg {
  position:relative;
  width:100%;
  max-width:720px;
  background:var(--card);
  border:1px solid var(--bd);
  border-radius:18px;
  padding:24px;
  margin:auto
}

.x {
  position:absolute;
  top:10px;
  right:14px;
  background:none;
  font-size:24px;
  line-height:1;
  color:var(--mu)
}

.plans {
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:14px;
  margin:16px 0 8px
}

.plan {
  display:flex;
  flex-direction:column;
  gap:8px;
  border:1.5px solid var(--bd);
  border-radius:14px;
  padding:16px
}

.plan.pro {
  border-color:var(--pr);
  background:var(--pr2)
}

.plan ul {
  flex:1;
  list-style:none;
  margin:0;
  padding:0
}

.plan li {
  padding:3px 0
}

.plan li.no {
  color:var(--mu);
  text-decoration:line-through
}

.price {
  font-size:22px;
  font-weight:800
}

@media(max-width:760px) {
  .plans {
    grid-template-columns:1fr
  }
}

/* Tema ceria */
:root {
  --b1:#dfe9ff;
  --b2:#e6e0ff
}

@media(prefers-color-scheme:dark) {
  :root:not([data-theme=light]) {
    --b1:#1b2c55;
    --b2:#2a2550
  }
}

:root[data-theme=dark] {
  --b1:#1b2c55;
  --b2:#2a2550
}

body {
  background:radial-gradient(circle at 6% 0,var(--b1) 0,transparent 34%),radial-gradient(circle at 100% 18%,var(--b2) 0,transparent 30%),var(--bg) fixed
}

h1,h2,h3,.logo {
  font-family:Fredoka,Inter,system-ui,sans-serif
}

h1 {
  font-size:32px;
  font-weight:700
}

h2 {
  font-weight:600
}

.card {
  position:relative;
  border-radius:20px;
  border-width:1.5px
}

.btn {
  border-radius:999px;
  padding:10px 20px;
  background:linear-gradient(135deg,#5b95ff,var(--pr));
  box-shadow:0 4px 0 rgba(20,40,120,.28);
  transition:transform .12s,box-shadow .12s
}

.btn:hover {
  transform:translateY(-1px)
}

.btn:active {
  transform:translateY(3px);
  box-shadow:0 1px 0 rgba(20,40,120,.28)
}

.btn.s {
  background:var(--pr2);
  box-shadow:0 4px 0 var(--bd)
}

.btn:disabled {
  transform:none
}

nav button.on {
  border-radius:999px
}

.tag {
  border-radius:999px;
  padding:2px 10px
}

.hero {
  position:relative;
  overflow:hidden;
  border-radius:28px;
  border:0;
  background:radial-gradient(circle at 92% 8%,var(--b2) 0,transparent 30%),radial-gradient(circle at 4% 100%,var(--b1) 0,transparent 40%),var(--card);
  box-shadow:0 14px 40px rgba(47,107,255,.14)
}

.stu {
  position:relative;
  width:min(290px,100%);
  aspect-ratio:345/395;
  margin:0 auto
}

.stu:before {
  content:"";
  position:absolute;
  inset:8px -10px -10px 10px;
  border-radius:46% 54% 42% 58%/52% 46% 54% 48%;
  background:linear-gradient(140deg,#5cc8ff,#7c6bff);
  transform:rotate(4deg)
}

.stu img {
  position:relative;
  width:100%;
  height:100%;
  object-fit:cover;
  border:6px solid #fff;
  border-radius:46% 54% 42% 58%/52% 46% 54% 48%;
  box-shadow:0 18px 36px rgba(47,107,255,.28)
}

.chip {
  position:absolute;
  background:#fff;
  color:#14213d;
  font-weight:700;
  font-size:12px;
  padding:6px 12px;
  border-radius:999px;
  box-shadow:0 6px 16px rgba(20,33,61,.2);
  white-space:nowrap
}

.chip.c1 {
  top:4%;
  left:-2%
}

.chip.c2 {
  bottom:24%;
  right:-2%
}

.chip.c3 {
  bottom:2%;
  left:0
}

.emo {
  position:absolute;
  font-size:30px;
  filter:drop-shadow(0 4px 6px rgba(0,0,0,.2))
}

.emo.e1 {
  top:-2%;
  right:4%
}

.emo.e2 {
  top:40%;
  left:-3%
}

.emo.e3 {
  bottom:34%;
  right:-3%
}

.subj {
  background:linear-gradient(160deg,color-mix(in srgb,var(--sc,#dbeafe) 60%,var(--card)),var(--card) 72%)
}

.greet {
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:10px;
  flex-wrap:wrap;
  margin-bottom:16px;
  padding:10px 16px;
  border:2px dashed var(--pr);
  border-radius:16px;
  background:var(--card);
  font-weight:600
}

.mi {
  padding:5px 0
}

.mi.done {
  color:var(--ok);
  font-weight:600
}

.cf {
  position:absolute;
  inset:0;
  overflow:hidden;
  pointer-events:none;
  border-radius:20px
}

.cf i {
  position:absolute;
  top:-24px;
  font-style:normal;
  font-size:20px;
  opacity:0
}

@media(prefers-reduced-motion:no-preference) {
    .card.item,.subj {
    transition:transform .2s,box-shadow .2s
  }
    .card.item:hover,.subj:hover {
    transform:translateY(-4px) rotate(-.6deg);
    box-shadow:0 14px 28px rgba(47,107,255,.18)
  }
    .cf i {
    animation:fall 2.6s ease-in forwards
  }
  @keyframes fall {
    10% {
      opacity:1
    }
    to {
      transform:translateY(420px) rotate(360deg);
      opacity:0
    }
  }
    .pop {
    animation:pop .6s cubic-bezier(.3,1.6,.5,1)
  }
  @keyframes pop {
    from {
      transform:scale(.3)
    }
  }
}

@media(max-width:760px) {
  h1 {
    font-size:25px
  }
  .chip {
    font-size:11px;
    padding:5px 9px
  }
}

/* Foto pelajar: satu sumber gambar, dipotong lewat CSS */
.face {
  display:inline-block;
  flex:none;
  width:var(--s,44px);
  height:var(--s,44px);
  border-radius:50%;
  border:3px solid #fff;
  background:var(--img) no-repeat;
  background-size:calc(var(--s)*2.133);
  background-position:calc(var(--s)*-.458) calc(var(--s)*-.083);
  box-shadow:0 6px 16px rgba(47,107,255,.35)
}

.stu .ph {
  position:relative;
  width:100%;
  height:100%;
  border:6px solid #fff;
  border-radius:46% 54% 42% 58%/52% 46% 54% 48%;
  background:var(--img) center/cover no-repeat;
  box-shadow:0 18px 36px rgba(47,107,255,.3)
}

.stu {
  aspect-ratio:1
}

.pgh {
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:16px;
  flex-wrap:wrap;
  margin-bottom:18px;
  padding:16px 22px;
  border-radius:24px;
  background:linear-gradient(120deg,var(--b1),var(--b2))
}

.pgh h1 {
  margin:0 0 4px
}

.mr {
  display:flex;
  align-items:center;
  gap:12px
}

.say {
  position:relative;
  max-width:220px;
  padding:9px 14px;
  border-radius:16px;
  background:#fff;
  color:#14213d;
  font-size:13px;
  font-weight:600;
  text-align:left;
  box-shadow:0 6px 16px rgba(20,33,61,.16)
}

.say:after {
  content:"";
  position:absolute;
  right:-7px;
  top:50%;
  margin-top:-7px;
  border:7px solid transparent;
  border-left-color:#fff;
  border-right:0
}

#mascot {
  position:fixed;
  right:14px;
  bottom:calc(14px + env(safe-area-inset-bottom,0px));
  z-index:10;
  display:flex;
  align-items:center;
  gap:10px;
  background:none;
  padding:0
}

@media(prefers-reduced-motion:no-preference) {
  #mascot .face,.mr .face {
    animation:bob 3s ease-in-out infinite
  }
  @keyframes bob {
    50% {
      transform:translateY(-5px)
    }
  }
}

@media(max-width:760px) {
  .mr .say {
    display:none
  }
  #mascot .say {
    max-width:150px;
    font-size:12px
  }
}

/* Jenjang, profil, trial */
header {
  gap:12px
}

nav {
  min-width:0
}

.hs input {
  width:140px
}

.tb {
  display:flex;
  gap:8px;
  flex-wrap:wrap;
  margin:0 0 16px
}

.tb button {
  background:var(--card);
  border:1.5px solid var(--bd);
  border-radius:999px;
  padding:8px 16px;
  font-weight:600
}

.tb button.on {
  background:linear-gradient(135deg,#5b95ff,#7c6bff);
  color:#fff;
  border-color:transparent
}

.avi {
  display:inline-grid;
  place-items:center;
  flex:none;
  width:var(--s);
  height:var(--s);
  border-radius:50%;
  object-fit:cover;
  background:var(--pr2);
  color:var(--pr);
  font-weight:700;
  font-size:calc(var(--s)*.42);
  border:2px solid #fff;
  box-shadow:0 0 0 2px var(--pr)
}

.pf {
  display:flex;
  align-items:center;
  gap:8px;
  padding:3px 14px 3px 3px;
  border-radius:999px;
  background:var(--pr2);
  color:var(--pr)
}

.pf.on {
  box-shadow:0 0 0 2px var(--pr)
}

.dlg {
  max-width:920px
}

.plans {
  grid-template-columns:repeat(3,1fr)
}

.plan.tr {
  position:relative;
  border-color:#7c6bff;
  background:linear-gradient(160deg,var(--pr2),var(--b2));
  transform:scale(1.03)
}

.rib {
  position:absolute;
  top:-12px;
  left:50%;
  transform:translateX(-50%);
  white-space:nowrap;
  background:linear-gradient(135deg,#7c6bff,#3aa0ff);
  color:#fff;
  font-size:12px;
  font-weight:700;
  padding:3px 12px;
  border-radius:999px
}

.toast {
  position:fixed;
  left:50%;
  top:76px;
  transform:translateX(-50%);
  z-index:30;
  background:linear-gradient(135deg,#7c6bff,#3aa0ff);
  color:#fff;
  padding:10px 18px;
  border-radius:999px;
  font-weight:700;
  box-shadow:0 10px 24px rgba(47,107,255,.35);
  max-width:92vw;
  text-align:center
}

@media(max-width:860px) {
  .plans {
    grid-template-columns:1fr
  }
  .plan.tr {
    transform:none;
    margin-top:8px
  }
}

.layout.l3 {
  grid-template-columns:200px 1fr 220px
}

.layout.l2 {
  grid-template-columns:1fr 220px
}

@media(max-width:760px) {
  .layout.l3,.layout.l2 {
    grid-template-columns:1fr
  }
}

}

function mulb(s){let a=0;for(const c of s)a=(a*31+c.charCodeAt(0))|0;return()=>{a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
const gcd=(a,b)=>b?gcd(b,a%b):a,fr=(n,d)=>{const g=gcd(n,d);n/=g;d/=g;return d===1?''+n:n+'/'+d};
const RP=n=>'Rp'+n.toLocaleString('id-ID'),DC=v=>(Math.round(v*100)/100).toString().replace('.',',');
function mk(t,ri,r){let q,c,w,e;switch(t){
case 0:{const x=ri(2,9),y=ri(2,9),p=ri(2,4),s=ri(2,4);q=`Diketahui ${p}x + ${s}y = ${p*x+s*y} dan x − y = ${x-y}. Nilai x · y adalah …`;c=x*y;w=[x+y,x*y+x,x*y-y];e=`Dari x − y = ${x-y} diperoleh x = y + (${x-y}). Substitusi: ${p}(y + (${x-y})) + ${s}y = ${p*x+s*y} → ${p+s}y = ${p*x+s*y-p*(x-y)} → y = ${y}, x = ${x}. Jadi x · y = ${c}.`;break}
case 1:{const p=ri(1,8),s=ri(p+1,9);q=`Akar-akar persamaan x² − ${p+s}x + ${p*s} = 0 adalah x₁ dan x₂. Nilai x₁² + x₂² adalah …`;c=p*p+s*s;w=[(p+s)**2,p*s,p+s];e=`x₁ + x₂ = ${p+s} dan x₁x₂ = ${p*s}. x₁² + x₂² = (x₁ + x₂)² − 2x₁x₂ = ${(p+s)**2} − ${2*p*s} = ${c}.`;break}

'smp|Matematika|Aljabar':[
['Bentuk Aljabar dan Sukunya','Variabel (misal x) adalah lambang pengganti bilangan. Koefisien adalah angka di depan variabel, konstanta adalah suku tanpa variabel, dan suku sejenis memiliki variabel serta pangkat yang sama. Penjumlahan dan pengurangan hanya boleh pada suku sejenis: 3x + 5x = 8x, tetapi 3x + 5y tidak dapat disederhanakan. Perkalian memakai sifat distributif: (a + b)(c + d) = ac + ad + bc + bd.<br>Identitas penting: (a + b)² = a² + 2ab + b²; (a − b)² = a² − 2ab + b²; a² − b² = (a + b)(a − b).<br><b>Contoh:</b> (2x + 3)(x − 4) = 2x² − 8x + 3x − 12 = 2x² − 5x − 12.','Gabungkan hanya suku sejenis dan hafal tiga identitas kuadrat.'],
['Persamaan Linear Satu Variabel','Bentuk umum ax + b = c dengan a ≠ 0. Lakukan operasi yang sama pada kedua ruas: pindahkan konstanta ke satu ruas, variabel ke ruas lain, lalu bagi dengan koefisien.<br><b>Contoh:</b> 3(x − 2) = 2x + 5 → 3x − 6 = 2x + 5 → x = 11. Cek: 3(9) = 27 dan 2(11) + 5 = 27 ✓.<br>Soal cerita: ubah kalimat menjadi model, misalnya “umur ayah 3 kali umur anak, jumlahnya 48” → x + 3x = 48 → x = 12.','Operasi di kedua ruas harus sama; cek jawaban dengan substitusi.'],
['Pertidaksamaan Linear','Penyelesaiannya serupa persamaan, tetapi tanda dibalik jika kedua ruas dikali atau dibagi bilangan negatif. <b>Contoh:</b> −2x + 1 > 7 → −2x > 6 → x < −3. Pada garis bilangan, bulatan kosong untuk &lt; atau &gt;, bulatan penuh untuk ≤ atau ≥.','Tanda berbalik saat dikali atau dibagi bilangan negatif.'],
['Fungsi Linear dan Gradien','Fungsi linear f(x) = mx + c berupa garis lurus dengan gradien m dan memotong sumbu-y di (0, c). Gradien melalui dua titik: m = (y₂ − y₁)/(x₂ − x₁). Persamaan garis melalui (x₁, y₁) bergradien m: y − y₁ = m(x − x₁). Dua garis sejajar jika gradiennya sama dan tegak lurus jika m₁ · m₂ = −1.<br><b>Contoh:</b> garis melalui (1, 3) dan (3, 7): m = 4/2 = 2 → y − 3 = 2(x − 1) → y = 2x + 1.','m = Δy/Δx; sejajar: m sama; tegak lurus: m₁·m₂ = −1.'],
['Sistem Persamaan Linear Dua Variabel','Gunakan eliminasi (samakan koefisien satu variabel lalu kurangkan atau jumlahkan) atau substitusi (nyatakan satu variabel dengan variabel lain).<br><b>Contoh:</b> x + y = 10 dan 2x − y = 8. Dijumlahkan: 3x = 18 → x = 6, y = 4. Cek: 12 − 4 = 8 ✓.','Eliminasi bila koefisien mudah disamakan; substitusi bila ada koefisien 1.'],
['Barisan dan Deret','Aritmetika (beda b): Uₙ = a + (n − 1)b dan Sₙ = n/2 · (2a + (n − 1)b). Geometri (rasio r): Uₙ = a·rⁿ⁻¹ dan Sₙ = a(rⁿ − 1)/(r − 1) untuk r > 1.<br><b>Contoh:</b> 3, 7, 11, … → U₁₀ = 3 + 9·4 = 39 dan S₁₀ = 5(6 + 36) = 210. Barisan 2, 6, 18, … → r = 3 dan U₅ = 2·3⁴ = 162.','Cek dulu beda (tambah) atau rasio (kali) sebelum memilih rumus.'],
['Kesalahan Umum','(1) Menjumlahkan suku tidak sejenis. (2) Lupa membalik tanda pertidaksamaan. (3) Salah tanda saat memindah ruas. (4) Mengira (a + b)² = a² + b². (5) Memakai n, bukan (n − 1), pada Uₙ.','Waspadai: suku tidak sejenis, tanda, pindah ruas, (a+b)², dan n − 1.']],
'sma|Matematika|Aljabar':[
['Persamaan Kuadrat','Bentuk ax² + bx + c = 0 (a ≠ 0). Cara menyelesaikan: pemfaktoran, melengkapkan kuadrat, atau rumus abc: x = (−b ± √(b² − 4ac)) / 2a.<br><b>Contoh:</b> x² − 5x + 6 = 0 → (x − 2)(x − 3) = 0 → x = 2 atau x = 3.','Gunakan pemfaktoran jika bisa; rumus abc selalu berlaku.'],
['Diskriminan dan Sifat Akar','D = b² − 4ac. D > 0: dua akar real berbeda; D = 0: akar kembar; D < 0: tidak ada akar real. Jumlah akar x₁ + x₂ = −b/a dan hasil kali x₁x₂ = c/a. Bentuk simetris: x₁² + x₂² = (x₁ + x₂)² − 2x₁x₂.<br><b>Contoh:</b> x² − 6x + 4 = 0 → x₁² + x₂² = 36 − 8 = 28.','D menentukan jenis akar; hubungan akar: −b/a dan c/a.'],
['Pertidaksamaan Kuadrat','Cari akar-akarnya, gambar parabola atau garis bilangan, lalu pilih daerah sesuai tanda. Untuk a > 0: (x − p)(x − q) < 0 berarti p < x < q, dan > 0 berarti x < p atau x > q.','Cari akar dulu, lalu uji tanda tiap daerah.'],
['Fungsi, Komposisi, dan Invers','(f ∘ g)(x) = f(g(x)); urutan penting karena umumnya f∘g ≠ g∘f. Invers: tukar x dan y lalu selesaikan. Untuk f(x) = (ax + b)/(cx + d), f⁻¹(x) = (−dx + b)/(cx − a).<br><b>Contoh:</b> f(x) = 2x + 3, g(x) = x² → (f∘g)(x) = 2x² + 3 dan (g∘f)(x) = (2x + 3)².','Komposisi dikerjakan dari fungsi dalam; invers = tukar x dan y.'],

'utbk|Penalaran Umum|Penalaran Logis':[
['Dasar Penalaran Deduktif','Premis adalah pernyataan yang dianggap benar; simpulan valid jika pasti mengikuti premis. Jangan memakai pengetahuan di luar soal. Kata “pasti”, “selalu”, dan “semua” menuntut bukti kuat, sedangkan “mungkin” dan “sebagian” lebih longgar.','Gunakan hanya informasi di soal; simpulan harus pasti.'],
['Silogisme dan Diagram','Semua A adalah B + Semua B adalah C → Semua A adalah C. Jika premis memuat “sebagian”, simpulan hanya boleh memuat “sebagian”. Gambar diagram lingkaran: A di dalam B, B di dalam C. Dua premis “sebagian” umumnya tidak menghasilkan simpulan pasti.','Gambar diagram lingkaran dan uji tiap pilihan.'],
['Implikasi dan Kontraposisi','Untuk “jika P maka Q”: konvers (Q → P) dan invers (¬P → ¬Q) belum tentu benar, sedangkan kontraposisi (¬Q → ¬P) selalu setara. Modus ponens: P → Q dan P, maka Q. Modus tollens: P → Q dan ¬Q, maka ¬P. Kekeliruan umum: dari Q menyimpulkan P.','Hanya kontraposisi yang setara dengan implikasi.'],
['Negasi dan Kuantor','Negasi “semua A adalah B” adalah “ada A yang bukan B”. Negasi “ada A yang B” adalah “tidak ada A yang B”. Negasi “P dan Q” adalah “¬P atau ¬Q”, dan negasi “P atau Q” adalah “¬P dan ¬Q”.','Negasi “semua” = “ada yang tidak”; hukum De Morgan untuk dan/atau.']]};
